<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Laptop Warranty Support (ML)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F5F6F4; --panel: #FFFFFF; --ink: #182225; --ink-soft: #5B6B6E;
    --line: #DFE4E2; --accent: #0F6E63; --accent-ink: #FFFFFF; --accent-soft: #E4F0EE;
    --bot-bubble: #EFF2F1; --user-bubble: #0F6E63; --user-ink: #FFFFFF;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: "IBM Plex Sans", system-ui, sans-serif;
    display: flex; justify-content: center;
  }
  .app {
    width: 100%; max-width: 640px; height: 100vh;
    display: flex; flex-direction: column;
    background: var(--panel);
    border-left: 1px solid var(--line); border-right: 1px solid var(--line);
  }
  header {
    display: flex; align-items: center; gap: 12px;
    padding: 16px 20px; border-bottom: 1px solid var(--line); flex-shrink: 0;
  }
  .mark {
    width: 38px; height: 38px; border-radius: 10px; background: var(--accent-soft);
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .mark svg { width: 20px; height: 20px; stroke: var(--accent); }
  header .title { font-weight: 700; font-size: 15px; }
  header .status { font-size: 12.5px; color: var(--ink-soft); display: flex; align-items: center; gap: 6px; margin-top: 2px; }
  header .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
  main { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
  .row { display: flex; }
  .row.bot { justify-content: flex-start; }
  .row.user { justify-content: flex-end; }
  .bubble { max-width: 82%; padding: 11px 14px; border-radius: 14px; font-size: 14.5px; line-height: 1.55; white-space: pre-wrap; }
  .row.bot .bubble { background: var(--bot-bubble); border-bottom-left-radius: 4px; }
  .row.user .bubble { background: var(--user-bubble); color: var(--user-ink); border-bottom-right-radius: 4px; }
  #composer { display: flex; gap: 10px; padding: 14px 16px; border-top: 1px solid var(--line); flex-shrink: 0; }
  input[type="text"] {
    flex: 1; border: 1px solid var(--line); background: var(--bg); color: var(--ink);
    border-radius: 10px; padding: 11px 14px; font-size: 14.5px; font-family: inherit; outline: none;
  }
  input[type="text"]:focus { border-color: var(--accent); }
  button.send {
    border: none; background: var(--accent); color: var(--accent-ink);
    padding: 0 18px; border-radius: 10px; font-size: 14px; font-weight: 600;
    cursor: pointer; font-family: inherit;
  }
  .typing { display: inline-flex; gap: 4px; padding: 4px 2px; }
  .typing span { width: 6px; height: 6px; border-radius: 50%; background: var(--ink-soft); animation: blink 1.1s infinite ease-in-out; }
  .typing span:nth-child(2) { animation-delay: 0.15s; }
  .typing span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes blink { 0%, 80%, 100% { opacity: 0.25; } 40% { opacity: 1; } }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="mark">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="4" width="18" height="12" rx="1.5"></rect>
        <path d="M1.5 19h21"></path>
      </svg>
    </div>
    <div>
      <div class="title">Laptop Warranty Support</div>
      <div class="status"><span class="dot"></span>ML intent model · Flask backend</div>
    </div>
  </header>

  <main id="thread"></main>

  <div id="composer">
    <input type="text" id="input" placeholder="Ask about warranty, repairs, or service…" autocomplete="off">
    <button type="button" class="send" id="sendBtn">Send</button>
  </div>
</div>

<script>
(function () {
  const thread = document.getElementById('thread');
  const input = document.getElementById('input');
  const sendBtn = document.getElementById('sendBtn');

  let sessionId = localStorage.getItem('warranty_session_id');
  if (!sessionId) {
    sessionId = (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()));
    localStorage.setItem('warranty_session_id', sessionId);
  }

  function escapeHtml(s) {
    const d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  function addBubble(role, html) {
    const row = document.createElement('div');
    row.className = 'row ' + role;
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.innerHTML = html;
    row.appendChild(bubble);
    thread.appendChild(row);
    thread.scrollTop = thread.scrollHeight;
    return bubble;
  }

  function addUser(text) { addBubble('user', escapeHtml(text)); }

  async function sendMessage() {
    const text = input.value.trim();
    if (!text) return;
    addUser(text);
    input.value = '';

    const typingBubble = addBubble('bot', '<span class="typing"><span></span><span></span><span></span></span>');

    try {
      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ session_id: sessionId, message: text })
      });
      const data = await res.json();
      sessionId = data.session_id || sessionId;
      localStorage.setItem('warranty_session_id', sessionId);
      typingBubble.innerHTML = escapeHtml(data.reply).replace(/\n/g, '<br>');
    } catch (err) {
      typingBubble.innerHTML = "Sorry, I couldn't reach the server. Is server.py running?";
    }
    thread.scrollTop = thread.scrollHeight;
  }

  sendBtn.addEventListener('click', sendMessage);
  input.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { e.preventDefault(); sendMessage(); }
  });

  addBubble('bot', "Hello! Tell me your laptop brand and what's going on — warranty status, damage, or a repair.");
})();
</script>
</body>
</html>
